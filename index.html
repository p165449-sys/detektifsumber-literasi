/* ===== BAR ATAS ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;background:rgba(6,9,36,.6);backdrop-filter:blur(8px);color:#fff;border-bottom:2px solid rgba(25,198,240,.35)}
#topbar .logo{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
#topbar .logo img{height:26px}
.semak-strip{display:flex;gap:4px}
.semak-strip span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:14px;color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.25);border:2px solid #fff}
.semak-strip span:nth-child(1){background:var(--pink)}.semak-strip span:nth-child(2){background:var(--orange)}
.semak-strip span:nth-child(3){background:var(--green)}.semak-strip span:nth-child(4){background:var(--cyan)}.semak-strip span:nth-child(5){background:var(--purple)}
#starBar{width:150px}
#playerTag{font-weight:800;font-size:13px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== PETA ===== */
#mapWrap{position:absolute;inset:0;z-index:1;transition:opacity .4s;overflow-y:auto;overflow-x:hidden;padding-top:54px}
#map{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:400/860}
#map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit-dim{fill:none;stroke:rgba(255,255,255,.22);stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round}
.orbit-lit{fill:none;stroke:#FFD23F;stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round;filter:drop-shadow(0 0 6px #FFC21F);animation:flow 1.2s linear infinite}
.orbit-glow{fill:none;stroke:rgba(255,210,63,.18);stroke-width:22;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-32}}
.sdeco{position:absolute;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.spin-slow{animation:spinD 40s linear infinite}.spin-rev{animation:spinD 55s linear infinite reverse}
@keyframes spinD{to{transform:rotate(360deg)}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{50%{transform:translate(14px,-18px) rotate(20deg)}}
.flyby{position:absolute;left:-15%;top:60%;width:34px;animation:flyby 16s linear infinite;animation-delay:3s;pointer-events:none;z-index:0;opacity:0}
.flyby img{width:100%;display:block}
.flyby .fl{width:16px;margin:-4px auto 0;transform:rotate(180deg)}
@keyframes flyby{0%{opacity:0;transform:translate(0,0) rotate(60deg)}5%{opacity:1}45%{opacity:1;transform:translate(1300%,-900%) rotate(60deg)}50%,100%{opacity:0;transform:translate(1300%,-900%) rotate(60deg)}}
.planet-node{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;padding:0;z-index:1;transition:transform .2s}
.planet-node:hover:not(.locked){transform:translate(-50%,-50%) scale(1.08)}
.planet-node img.pl,.planet-node img.sh{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.planet-node img.pl{animation:spinD 60s linear infinite}
.planet-node img.sh{mix-blend-mode:soft-light;opacity:.9}
.planet-node.lit{filter:drop-shadow(0 0 14px rgba(120,220,255,.55))}
.planet-node.locked img.pl{filter:brightness(.75) saturate(.6)}
.planet-node.locked img.sh{mix-blend-mode:multiply;opacity:1}
.planet-node .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Nunito',system-ui,sans-serif;font-weight:900;font-size:34px;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 12px rgba(0,0,0,.5)}
.planet-node .lockic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.eclipse-node .sun{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,#FFF6B0 0 35%,#FFC93A 60%,#FF8A1F 100%);
  box-shadow:0 0 22px 8px rgba(255,190,60,.75),0 0 60px 18px rgba(255,140,40,.35);animation:corona 3s ease-in-out infinite}
.eclipse-node img.moon{position:absolute;width:78%;height:78%;left:30%;top:6%;border-radius:50%;filter:brightness(.28) saturate(.3)}
.eclipse-node.locked .sun{filter:brightness(.45) saturate(.5);box-shadow:none;animation:none}
@keyframes corona{50%{box-shadow:0 0 30px 12px rgba(255,200,80,.9),0 0 80px 26px rgba(255,140,40,.45)}}
.target{position:absolute;transform:translate(-50%,-50%);width:146px;height:146px;pointer-events:none;animation:spinT 6s linear infinite;z-index:0;opacity:.95}
@keyframes spinT{to{transform:translate(-50%,-50%) rotate(360deg)}}
.node-label{position:absolute;transform:translate(-50%,0);white-space:nowrap;background:rgba(6,9,36,.75);color:#fff;font-weight:900;font-size:13px;
  padding:4px 12px;border-radius:12px;border:2px solid rgba(25,198,240,.6);z-index:1}
.node-label.locked{color:#9aa0c8;border-color:rgba(255,255,255,.2)}
.node-stars{position:absolute;transform:translate(-50%,-100%);font-size:20px;letter-spacing:-2px;white-space:nowrap;z-index:1;filter:drop-shadow(0 0 4px rgba(255,210,63,.8))}
.node-stars .off{filter:grayscale(1);opacity:.4}
#hero{position:absolute;width:64px;transform:translate(-50%,-92%);pointer-events:none;z-index:3}
#hero img.body{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
#hero.idle img.body{animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-7px)}}
#hero img.jet{position:absolute;left:50%;bottom:-30px;width:20px;transform:translateX(-50%);opacity:0;transition:opacity .2s}
#hero.flying img.jet{opacity:1;animation:jet .12s linear infinite alternate}
@keyframes jet{to{transform:translateX(-50%) scaleY(1.25)}}
#hero.flip img.body{transform:scaleX(-1)}

.panel-head{position:absolute;left:4px;right:4px;top:-54px;height:46px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff}
.panel-head h2{font-family:var(--display);font-size:20px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-head .kbar{width:150px;flex:none}
.close-x{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;font-weight:900;font-size:18px;border:2px solid rgba(255,255,255,.6)}
.panel-body{padding:16px 8px 8px}

.dina-say{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px}
.dina-say img{width:86px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.bubble{background:#fff;border:3px solid #fff;border-radius:16px;padding:12px 16px;font-size:16px;line-height:1.45;position:relative;box-shadow:0 4px 0 var(--panel-edge);flex:1}
.bubble:after{content:"";position:absolute;left:-12px;bottom:18px;border:8px solid transparent;border-right:10px solid #fff;border-left:0}
.situasi{display:flex;gap:12px;align-items:center;background:#FFF6D6;border:3px solid #fff;border-radius:16px;padding:8px 14px;font-weight:800;margin-bottom:14px;box-shadow:0 4px 0 #E2C66A}
.situasi img{height:64px;flex:none}
.rules{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;line-height:1.6;box-shadow:0 4px 0 var(--panel-edge);margin-bottom:16px}
.caption-note{font-size:14px;font-weight:800;color:#4b5175;margin:8px 0 18px;text-align:center}
.caption-note:before{content:"🔎 "}
.q-title{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:900;font-size:18px;margin:6px 0 4px;line-height:1.3}
.q-sub{font-size:14px;color:#5b6283;margin-bottom:10px;font-weight:700}

/* pilihan (a) */
.a-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.a-opts .kbtn{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:900;font-size:15px;letter-spacing:0;width:100%}
.a-opts .kbtn.sel{outline:4px solid var(--ink);outline-offset:3px;border-radius:30px}
.a-opts .kbtn.dim{filter:grayscale(.7) opacity(.5)}

/* pilihan (b) – jubin panel kaca */
.b-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.b-opt{text-align:left;padding:12px 14px 12px 52px;border-radius:14px;font-size:15px;font-weight:800;line-height:1.35;color:var(--ink);
  background:#F4F5FA;border:3px solid #fff;position:relative;box-shadow:0 5px 0 var(--panel-edge);transition:transform .1s}
.b-opt:before{content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;
  background:var(--panel);box-shadow:inset 0 3px 0 rgba(0,0,0,.12);border:2px solid #fff}
.b-opt.sel{background:#FFF1C2;box-shadow:0 5px 0 #E2A92F}
.b-opt.sel:before{background:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.b-opt.sel:after{content:"✓";position:absolute;left:20px;top:50%;transform:translateY(-52%);color:var(--ink);font-weight:900;font-size:18px}
.b-opt:active{transform:translateY(3px)}

.center{text-align:center}
.btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.hint-warn{text-align:center;color:#D12F45;font-weight:900;margin-top:12px;min-height:20px}

/* input nama */
.name-box{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:8px 8px 8px 16px;box-shadow:0 5px 0 var(--panel-edge);border:3px solid #fff}
.name-box:focus-within{border-color:var(--yellow)}
.name-box span{font-size:26px}
#nameInput,#pinInput{width:100%;flex:1;min-width:0;border:none;outline:none;font-size:22px;font-weight:900;color:var(--ink);background:transparent;padding:8px 0}
#nameInput::placeholder,#pinInput::placeholder{color:#a9acc2;font-weight:700}
.name-help{font-size:13px;color:#5b6283;font-weight:700;margin:8px 4px 0}
.resume{background:#E3FBEF;border:3px solid #fff;border-radius:16px;padding:10px 14px;margin-bottom:14px;font-weight:800;box-shadow:0 4px 0 #9BD8B5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link-btn{color:#4b3bb5;font-weight:900;text-decoration:underline;font-size:14px}

/* maklum balas */
.result-banner{text-align:center;padding:2px 0 4px}
.result-banner img{height:120px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15))}
.result-banner .big-stars{font-size:44px;letter-spacing:4px;margin-top:-8px}
.result-banner .big-stars span{display:inline-block;animation:starIn .5s cubic-bezier(.3,1.8,.6,1) both}
.result-banner .big-stars span:nth-child(2){animation-delay:.2s}.result-banner .big-stars span:nth-child(3){animation-delay:.4s}
.result-banner .big-stars .off{filter:grayscale(1);opacity:.35}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.result-banner h3{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:900;font-size:22px;margin-top:4px;line-height:1.3}
.fb-a{border-radius:14px;padding:12px 14px;margin:14px 0;font-weight:800;border:3px solid #fff}
.fb-a.ok{background:#E3FBEF;box-shadow:0 4px 0 #9BD8B5}
.fb-a.mid{background:#FFF1DA;box-shadow:0 4px 0 #EBC27E}
.fb-a.no{background:#FFE5E7;box-shadow:0 4px 0 #EFA5AC}
.fb-list{display:grid;gap:8px;margin:8px 0}
.fb-item{border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4;border:2px solid #fff}
.fb-item .tag{flex:none;font-weight:900;font-size:11.5px;padding:3px 8px;border-radius:8px;color:#fff;margin-top:1px;white-space:nowrap}
.fb-item.found{background:#E3FBEF}.fb-item.found .tag{background:#1FAE60}
.fb-item.miss{background:#FFF1DA}.fb-item.miss .tag{background:#E08A12}
.fb-item.trap{background:#FFE5E7}.fb-item.trap .tag{background:#E0334A}
.fb-item.safe{background:#EEEFF6}.fb-item.safe .tag{background:#8E91AE}
.fb-item b{display:block}
.fb-general{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800;line-height:1.45;box-shadow:0 4px 0 var(--panel-edge)}
.fb-general img{height:70px;flex:none}

/* ===================== TANGKAPAN SKRIN OLOK-OLOK ===================== */
.shot{border-radius:14px;overflow:hidden;border:3px solid #d8d0ea;background:#fff;box-shadow:0 6px 0 rgba(42,22,80,.15);font-family:Arial,Helvetica,sans-serif;color:#222}
.shot img{display:block;width:100%}
.browser-bar{background:#E9E9EE;padding:7px 10px;display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57;display:block}
.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url{flex:1;background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* TontonKita */
.tk-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #eee}
.tk-logo{font-weight:800;color:var(--navy);font-size:16px}.tk-logo b{color:var(--orange)}
.tk-search{flex:1;height:24px;border:1px solid #ddd;border-radius:12px;max-width:260px;margin-left:auto}
.tk-player{background:var(--navy);aspect-ratio:16/8;position:relative;display:grid;place-items:center;overflow:hidden}
.eclipse{position:relative;width:52%;height:60%}
.eclipse .sun{position:absolute;left:0;top:50%;transform:translateY(-50%);width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#FFE27A,#FFB300);box-shadow:0 0 30px #FFC94A}
.eclipse .moon{position:absolute;left:46%;top:50%;transform:translateY(-50%);width:12%;aspect-ratio:1;border-radius:50%;background:#9aa3b5}
.eclipse .earth{position:absolute;right:0;top:50%;transform:translateY(-50%);width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6FD3FF,#1F7FD6 60%,#2E9E5B)}
.tk-cap{position:absolute;left:8%;right:8%;bottom:8%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:5px 8px;border-radius:4px;text-align:center}
.tk-play{position:absolute;left:12px;top:12px;width:34px;height:34px;font-size:14px;border-radius:50%;background:rgba(224,145,47,.9);display:grid;place-items:center;color:#fff}
.tk-meta{padding:10px 12px}
.tk-title{font-weight:700;font-size:16px}
.tk-views{font-size:12px;color:#666;margin:2px 0 8px}
.tk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD86B,#FF9C3A);display:grid;place-items:center;font-size:17px}
.tk-ch{font-weight:700;font-size:13px}.tk-ch small{display:block;font-weight:400;color:#777;font-size:11px}
.tk-sub{background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:14px}
.tk-acts{margin-left:auto;display:flex;gap:6px}
.tk-acts span{background:#F1F2F5;border-radius:14px;padding:4px 10px;font-size:12px}
.tk-com{font-size:12px;margin-top:10px;color:#444;border-top:1px solid #eee;padding-top:8px}
.tk-com p{margin-top:4px}
/* Berita sensasi */
.bs{background:#fff}
.bs-top{background:#D7141A;color:#FFE600;font-weight:900;font-size:18px;padding:6px 12px;letter-spacing:.5px}
.bs-body{display:grid;grid-template-columns:1fr 120px;gap:10px;padding:10px 12px;position:relative}
.bs-h{font-weight:900;font-size:19px;line-height:1.15;text-transform:uppercase;color:#111}
.bs-by{font-size:12px;color:#777;margin:6px 0}
.bs-moon{height:110px;border-radius:6px;background:radial-gradient(circle 38px at 60% 50%,#f4f4f4 0 70%,#cfcfcf 72% 85%,transparent 88%),linear-gradient(#0b0b2e,#3a0b3a);margin-bottom:6px}
.bs-txt{font-size:12px;line-height:1.5;color:#333}
.bs-txt a{color:#1a5dff;text-decoration:underline;font-weight:700}
.bs-ad{background:#FFF59D;border:2px solid #FFB300;border-radius:6px;padding:8px;font-size:12px;font-weight:800;text-align:center;margin-bottom:8px;position:relative}
.bs-ad:before{content:"Iklan";position:absolute;top:-1px;right:3px;font-size:9px;color:#888;font-weight:400}
.bs-ad.b{background:#C8F7FF;border-color:#00B3E6}
.bs-ad.inline{margin:8px 0}
.bs-pop{position:absolute;right:16px;bottom:16px;width:170px;background:#fff;border:3px solid #D7141A;border-radius:8px;padding:8px;font-size:11px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);text-align:center}
.bs-pop span{position:absolute;top:2px;right:6px;color:#999}
.bs-pop i{display:block;background:#D7141A;color:#fff;border-radius:12px;padding:4px;margin-top:6px;font-style:normal}
.bs-cookie{background:#222;color:#eee;font-size:11px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
.bs-cookie i{background:#4caf50;color:#fff;padding:2px 10px;border-radius:10px;font-style:normal}
/* TanyaBot */
.tb{background:#F7F8FC}
.tb-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e6e6ef;font-weight:800;color:#3b3f8f}
.tb-head .ic{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6EE7F9,#8B5CF6);display:grid;place-items:center;color:#fff;font-size:14px}
.tb-chat{padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.tb-msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.tb-msg.user{align-self:flex-end;background:#4F6BFF;color:#fff;border-bottom-right-radius:4px}
.tb-msg.bot{align-self:flex-start;background:#fff;border:1px solid #e3e3ee;border-bottom-left-radius:4px}
.tb-in{margin:0 14px 6px;border:1px solid #ddd;border-radius:20px;background:#fff;padding:8px 14px;font-size:13px;color:#aaa}
.tb-foot{text-align:center;font-size:11px;color:#999;padding:4px 0 10px}


.tb-head .ic{width:30px;height:30px;background:none;border-radius:0}
.tb-head .ic img{height:30px}

/* rumusan */
.badge-wrap{position:relative;width:170px;height:170px;margin:0 auto 6px}
.badge-wrap .ring{position:absolute;inset:0;width:100%;animation:spinT2 8s linear infinite}
@keyframes spinT2{to{transform:rotate(360deg)}}
.badge{position:absolute;inset:22px;border-radius:50%;background:var(--navy);border:8px solid var(--orange);display:grid;place-items:center;overflow:hidden;animation:spin 1s cubic-bezier(.3,1.6,.6,1)}
.badge img{height:92px;margin-top:10px}
@keyframes spin{from{transform:rotate(-200deg) scale(.3)}}
.badge-title{text-align:center;font-family:var(--display);font-size:18px;color:var(--navy);margin-bottom:14px}
.sum-table{width:100%;border-collapse:separate;border-spacing:0 8px;margin:6px 0}
.sum-table td{background:#fff;padding:10px 12px;font-weight:800}
.sum-table td:first-child{border-radius:12px 0 0 12px}
.sum-table td:last-child{border-radius:0 12px 12px 0;text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;color:#fff;font-size:12.5px;font-weight:900}
.pill.ok{background:#1FAE60}.pill.no{background:#E08A12}
.copy-box{width:100%;margin-top:12px;padding:10px;border-radius:12px;border:2px solid var(--purple);font:800 14px Nunito,sans-serif}


/* ===== MUKA DEPAN ===== */
#cover{position:fixed;inset:0;z-index:70;overflow-y:auto;overflow-x:hidden;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px 40px;
  background:transparent;transition:opacity .45s, transform .45s}
body.on-cover #mapWrap,body.on-cover #topbar{opacity:0;pointer-events:none}
.scene{position:relative;width:240px;height:150px;margin:0 auto -6px}
.scene .sun{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  background:radial-gradient(circle,#FFF6B0 0 35%,#FFC93A 62%,#FF8A1F 100%);box-shadow:0 0 40px 14px rgba(255,190,60,.7),0 0 110px 40px rgba(255,120,40,.3);animation:corona2 10s ease-in-out infinite}
.scene .moon{position:absolute;left:50%;top:50%;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;filter:brightness(.22) saturate(.2);animation:transit 10s ease-in-out infinite}
@keyframes transit{0%{transform:translateX(-150px)}45%,55%{transform:translateX(0)}100%{transform:translateX(150px)}}
@keyframes corona2{0%,100%{box-shadow:0 0 40px 14px rgba(255,190,60,.7),0 0 110px 40px rgba(255,120,40,.3)}50%{box-shadow:0 0 26px 10px rgba(255,255,255,.9),0 0 140px 60px rgba(160,200,255,.45)}}
.cover-deco{position:fixed;pointer-events:none;z-index:0}

.cover-rocket img{width:100%;display:block}.cover-rocket .fl{width:26px;margin:-6px auto 0;transform:rotate(180deg)}
@keyframes hover{50%{transform:translateY(-14px) rotate(3deg)}}
.cover-inner{z-index:1}
#launch{position:fixed;left:50%;bottom:-200px;width:70px;z-index:90;pointer-events:none;display:none}
#launch img{width:100%;display:block}#launch .fl{width:34px;margin:-8px auto 0;transform:rotate(180deg);animation:jet .1s linear infinite alternate}
#launch.go{display:block;animation:launch 1.1s cubic-bezier(.5,0,.8,.4) forwards}

/* ===== PAPAN MARKAH & STATUS AWAN ===== */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:95;background:rgba(6,9,36,.92);color:#fff;font-weight:900;font-size:14px;
  padding:10px 18px;border-radius:14px;border:2px solid rgba(25,198,240,.6);transition:transform .35s cubic-bezier(.3,1.5,.6,1);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast:not(.show){visibility:hidden;transition:transform .35s, visibility 0s .35s}
#toast.bad{border-color:#FF5A5F}
.cover-help.err{color:#D12F45}
.board{width:100%;border-collapse:separate;border-spacing:0 8px}
.board th{font-size:12.5px;color:#4b5175;font-weight:900;text-align:left;padding:0 10px}
.board td{background:#fff;padding:8px 10px;font-weight:800;vertical-align:middle}
.board td:first-child{border-radius:12px 0 0 12px;text-align:center;font-size:20px;width:46px}
.board td:last-child{border-radius:0 12px 12px 0;text-align:right}
.board tr.me td{background:#FFF1C2;box-shadow:inset 0 0 0 0 #fff}
.board .who{display:flex;align-items:center;gap:8px}
.board .who img{height:40px}
.board .sc{font-size:13px;white-space:nowrap;text-align:center}
.board .tot{font-size:16px;white-space:nowrap}
.board-empty{background:#fff;border-radius:14px;padding:18px;text-align:center;font-weight:800;color:#4b5175}
.board-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:800;color:#4b5175;margin-bottom:6px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #c9cbe0;border-top-color:var(--purple);animation:spinD .8s linear infinite;margin:20px auto}
@media (max-width:640px){ .board .sc{display:none} .board .who img{height:32px} }

/* ===== SUSUN ATUR LAPTOP (MENDATAR) ===== */
.best-line{display:inline-block;margin-top:6px;background:#fff;border-radius:12px;padding:4px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--panel-edge)}
.mini-btn{margin-left:6px;width:30px;height:30px;border-radius:9px;background:var(--panel);font-size:15px;box-shadow:0 3px 0 var(--panel-edge);vertical-align:middle}
.id-row{display:grid;grid-template-columns:1fr;gap:12px}
.logo-br{display:none}
@media (min-width:820px) and (orientation:landscape){
  #modal{align-items:center;padding:14px 18px}
  .panel.wide{max-width:1240px}
  .panel.wide .panel-body{padding:10px 6px 4px}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
  .cols.cols-even{grid-template-columns:1fr 1fr}
  .cols .col{max-height:calc(100vh - 210px);overflow-y:auto;overflow-x:hidden;padding:2px 6px 8px 2px;scrollbar-width:thin}
  .panel.wide .btn-row{margin-top:12px}
  .cols .col .btn-row{position:sticky;bottom:-8px;margin:10px -6px -8px -2px;padding:12px 0 8px;background:linear-gradient(rgba(218,220,231,0),var(--panel) 35%);z-index:2}
  .panel.wide .a-opts{gap:10px;margin-bottom:16px}
  .panel.wide .a-opts .kbtn{font-size:14px}
  .panel.wide .b-opt{font-size:14px;padding:10px 12px 10px 48px}
  .panel.wide .situasi{margin-bottom:10px}
  .panel.wide .result-banner img{height:96px}
  .panel.wide .badge-wrap{width:150px;height:150px}

/* ===== DIALOG TAKLIMAT ===== */
.brief{display:flex;align-items:flex-end;gap:22px;padding:8px 10px 4px;min-height:300px}
.brief-dina{width:clamp(130px,16vw,200px);flex:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15));animation:floaty 2.6s ease-in-out infinite}
.brief-bubble{flex:1;position:relative;background:#fff;border-radius:24px;padding:22px 30px 24px;box-shadow:0 6px 0 var(--panel-edge);cursor:pointer;min-height:230px;display:flex;flex-direction:column}
.brief-bubble:after{content:"";position:absolute;left:-18px;bottom:46px;border:14px solid transparent;border-right:18px solid #fff;border-left:0}
.brief-who{font-family:var(--display);color:#7B3FF2;font-size:18px;margin-bottom:10px}
.brief-text{font-size:clamp(24px,2.3vw,32px);font-weight:800;line-height:1.45;color:var(--ink);min-height:3em}
.brief-vis{margin-top:auto;padding-top:16px;min-height:72px}
.bv-planets{display:flex;gap:18px}.bv-planets img{width:64px;height:64px;border-radius:50%;animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}
.bv-planets img:nth-child(2){animation-delay:.12s}.bv-planets img:nth-child(3){animation-delay:.24s}
.bv-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bv-row > *{animation:pop .4s cubic-bezier(.3,1.6,.6,1) both}.bv-row > *:nth-child(2){animation-delay:.1s}.bv-row > *:nth-child(3){animation-delay:.2s}
.bv-pill{color:#fff;font-weight:900;font-size:17px;padding:10px 18px;border-radius:30px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.bv-pill.g{background:#2FC36F}.bv-pill.r{background:#F0364F}.bv-pill.b{background:#1EA3E0}
.bv-tile{background:#F4F5FA;border:3px solid #fff;box-shadow:0 4px 0 var(--panel-edge);border-radius:12px;padding:10px 16px;font-weight:900;font-size:17px}
.bv-tile.on{background:#FFF1C2;box-shadow:0 4px 0 #E2A92F}
.bv-tag{color:#fff;font-weight:900;font-size:17px;padding:8px 14px;border-radius:10px}.bv-tag.trap{background:#E0334A}.bv-tag.ok{background:#1FAE60}
.bv-big{font-size:44px}
.brief-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding:0 6px}
.brief-nav .kbtn{font-size:21px;min-width:200px}
.kbtn:focus{outline:none}.kbtn:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:30px}

.brief-right{display:flex;gap:12px;align-items:center}

/* ===== ANIMASI SUMBER ===== */
.tk-player{overflow:hidden}
.eclipse .sun{animation:sunGlow 2.4s ease-in-out infinite}
@keyframes sunGlow{50%{box-shadow:0 0 46px #FFC94A,0 0 90px rgba(255,180,40,.5)}}
.eclipse .moon{animation:moonGo 6s ease-in-out infinite}
@keyframes moonGo{0%,100%{left:30%}50%{left:52%}}
.eclipse .earth{animation:earthBob 6s ease-in-out infinite}
@keyframes earthBob{50%{transform:translateY(-50%) scale(1.05)}}
.eclipse .beam{position:absolute;left:30%;right:18%;top:50%;height:2px;background:linear-gradient(90deg,rgba(255,220,120,.8),rgba(255,220,120,0));transform:translateY(-50%);animation:beam 6s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.2}50%{opacity:.9}}
.tk-play{animation:playPulse 1.6s ease-in-out infinite}
@keyframes playPulse{50%{transform:scale(1.08)}}
.tk-music{position:absolute;right:12px;top:12px;display:flex;align-items:flex-end;gap:3px;height:22px;color:#FFD27A;font-weight:900;font-size:16px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px}
.tk-music i{width:4px;background:#FFD27A;border-radius:2px;animation:eq .8s ease-in-out infinite}
.tk-music i:nth-child(1){animation-delay:-.2s}.tk-music i:nth-child(2){animation-delay:-.5s}.tk-music i:nth-child(3){animation-delay:-.1s}.tk-music i:nth-child(4){animation-delay:-.65s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.tk-cap{bottom:16%;animation:capIn .6s ease-out both .3s}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}}
.tk-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px}
.tk-prog{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.tk-prog i{display:block;height:100%;background:var(--orange);animation:prog 14s linear infinite}
@keyframes prog{from{width:35%}to{width:100%}}
.tk-acts .like{animation:likePop 2.2s ease-in-out infinite}
@keyframes likePop{0%,80%,100%{transform:none}88%{transform:scale(1.15)}}
.bs-top{display:flex;justify-content:space-between;align-items:center}
.bs-viral{background:#FFE600;color:#D7141A;font-size:12px;padding:2px 8px;border-radius:6px;animation:blink 0.9s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bs-ticker{background:#111;color:#FFE600;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;padding:4px 0}
.bs-ticker span{display:inline-block;padding-left:100%;animation:ticker 16s linear infinite}
@keyframes ticker{to{transform:translateX(-100%)}}
.bs-h{animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,90%,100%{transform:none}92%{transform:translateX(-3px) rotate(-.4deg)}94%{transform:translateX(3px) rotate(.4deg)}96%{transform:translateX(-2px)}}
.bs-moon{position:relative;background:linear-gradient(#0b0b2e,#3a0b3a);overflow:hidden}
.bs-moon .m{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fafafa,#cfcfcf 70%,#a9a9a9);box-shadow:0 0 30px rgba(255,255,255,.4);animation:vanish 4s ease-in-out infinite}
@keyframes vanish{0%,100%{opacity:1;transform:scale(1)}45%,55%{opacity:.08;transform:scale(.85)}}
.bs-ad{animation:adPulse 1.4s ease-in-out infinite}
.bs-ad:nth-child(2){animation-delay:-.5s}.bs-ad:nth-child(3){animation-delay:-.9s}.bs-ad.inline{animation-delay:-.3s}
@keyframes adPulse{50%{transform:scale(1.04);filter:hue-rotate(40deg) saturate(1.4)}}
.bs-pop{animation:popIn .5s cubic-bezier(.3,1.7,.6,1) both 1.2s, popShake 2.5s ease-in-out infinite 2s}
@keyframes popIn{from{opacity:0;transform:scale(.3) translateY(40px)}}
@keyframes popShake{0%,85%,100%{transform:none}90%{transform:rotate(-3deg)}95%{transform:rotate(3deg)}}
.bs-cookie{animation:cookieUp .5s ease-out both .6s}
@keyframes cookieUp{from{transform:translateY(100%)}}
.tb-msg.user{animation:capIn .4s ease-out both .2s}
.tb-typing{align-self:flex-start;display:flex;gap:5px;background:#fff;border:1px solid #e3e3ee;border-radius:16px;padding:12px 14px;animation:typingShow 1.9s linear both}
.tb-typing i{width:8px;height:8px;border-radius:50%;background:#9aa0c0;animation:dotB 1s ease-in-out infinite}
.tb-typing i:nth-child(2){animation-delay:.15s}.tb-typing i:nth-child(3){animation-delay:.3s}
@keyframes dotB{50%{transform:translateY(-5px);background:#4F6BFF}}
@keyframes typingShow{0%,25%{opacity:0;display:flex}30%,95%{opacity:1}100%{opacity:0;display:none}}
.tb-msg.bot{animation:capIn .5s ease-out both 1.9s}

/* Markah: 1 markah setiap petunjuk betul + 1 markah jika keputusan betul */
const markOf = r => r ? (r.markah ?? (r.correct + (r.aStatus==='ok'?1:0))) : 0;
const maxOf  = id => { const sc = SCENARIOS.find(s=>s.id===id); return sc ? sc.b.filter(o=>o.clue).length + 1 : 0; };
function better(a,b){ const ma=markOf(a), mb=markOf(b); return ma>mb || (ma===mb && a.traps<b.traps); }

const cloud = {
  on: () => !!SHEET_URL,
  async get(params){
    const r = await fetch(SHEET_URL + '?' + new URLSearchParams(params), {cache:'no-store'});
    return r.json();
  },
  async post(body){     // tanpa header supaya tiada "preflight" CORS (Apps Script menerimanya sebagai text/plain)
    const r = await fetch(SHEET_URL, {method:'POST', body: JSON.stringify(body)});
    return r.json();
  }
};
let toastTimer = null;
function toast(msg, bad=false){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('bad', bad); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}
/* Setiap cubaan dihantar ke awan; jika gagal, ia menunggu dalam baris gilir dan dihantar semula */
function cloudSave(id, rec){
  if(!cloud.on()) return;
  state.queue = state.queue || []; state.queue.push({id, rec}); save();
  flushPending(true);
}
let flushing = false;
function applyProgress(res){
  if(res.done){ for(const k of Object.keys(res.done)) if(!state.done[k] || better(res.done[k], state.done[k])) state.done[k] = res.done[k]; }
  if(res.first) state.first = Object.assign({}, res.first, state.first||{});
  if(res.tries) for(const k of Object.keys(res.tries)) state.tries[k] = Math.max(state.tries[k]||0, res.tries[k]);
}
async function flushPending(loud=false){
  if(!cloud.on() || flushing || !state.queue || !state.queue.length || !state.name) return;
  flushing = true;
  try{
    while(state.queue.length){
      const q = state.queue[0];
      const res = await cloud.post({action:'save', nama:state.name, pin:state.pin, id:q.id, rec:q.rec});
      if(!res.ok && (res.error==='pin'||res.error==='nouser')){ toast('⚠️ Markah tidak disimpan: nama/PIN tidak sepadan.', true); state.queue.shift(); save(); continue; }
      if(!res.ok) throw new Error(res.error);
      applyProgress(res); state.queue.shift(); save();
      if(loud) toast('☁️ Markah disimpan ke papan markah!');
    }
  }catch(e){ if(loud) toast('⚠️ Belum dapat menyimpan. Akan cuba lagi secara automatik.', true); }
  flushing = false;
}
setInterval(()=>flushPending(false), 20000);

function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f, d=.12, type='sine', vol=.18, at=0, slide=null){
  if(muted) return; const c = ac(); if(!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02);
}

/* Wira terbang dengan jet ke planet seterusnya */
function flyHero(from, to, onArrive){
  const el = document.getElementById('hero'), img = document.getElementById('heroImg'); if(!el) return;
  el.classList.remove('idle'); el.classList.add('flying'); el.classList.toggle('flip', to.x < from.x);
  img.src = P('jump'); sfx.fly();
  const dur = 1500, t0 = performance.now();
  scrollToNode(to);
  (function step(t){
    const k = Math.min(1,(t-t0)/dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    const arc = Math.sin(Math.PI*k) * (L.horiz ? 70 : 40);                                    // lengkung terbang
    const [x,y] = pct(from.x+L.dx + (to.x-from.x)*e, from.y+L.dy + (to.y-from.y)*e - arc);
    el.style.left = x+'%'; el.style.top = y+'%';
    if(k<1) requestAnimationFrame(step);
    else {
      el.classList.remove('flying','flip'); img.src = P('cheer0'); sfx.arrive();
      state.mapPos = progressIndex(); save();
      setTimeout(()=>{ if(img.isConnected){ img.src = P('idle'); el.classList.add('idle'); } if(onArrive) onArrive(); }, 650);
    }
  })(t0);
}

/* ===================== LANGIT BERBINTANG ===================== */
(function starfield(){
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  let W, H, st = [], shoot = null;
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight;
    st = Array.from({length: Math.round(W*H/5000)}, ()=>({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3, p:Math.random()*6.28, s:.5+Math.random()*1.5})); }
  size(); addEventListener('resize', size);
  (function loop(t){
    ctx.clearRect(0,0,W,H);
    for(const s of st){ const a = .35 + .65*Math.abs(Math.sin(s.p + t/1000*s.s)); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
    if(!shoot && Math.random()<.004) shoot = {x:Math.random()*W*.7, y:Math.random()*H*.4, v:9+Math.random()*5, l:0};
    if(shoot){ shoot.l += 1; shoot.x += shoot.v; shoot.y += shoot.v*.45;
      const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x-90, shoot.y-40); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y); ctx.lineTo(shoot.x-90, shoot.y-40); ctx.stroke();
      if(shoot.l > 60) shoot = null; }
    ctx.globalAlpha = 1; requestAnimationFrame(loop);
  })(0);
})();

  const cv = document.getElementById('cover');

    ? `<div class="resume" style="margin-top:12px"><span>👋 Selamat kembali, Detektif ${esc(state.name)}! Tekan MULA untuk sambung.</span><button class="link-btn" onclick="resetGame()">Bukan saya, mula semula</button></div>` : '';
  checkCover();
}
function setChar(c, sound=true){
  document.querySelectorAll('.char-card').forEach(b=>{ b.classList.toggle('sel', b.dataset.c===c); b.classList.toggle('dim', !!c && b.dataset.c!==c); });
  clearInterval(cardTimer);
  ['f','m'].forEach(k=>document.getElementById('cardImg_'+k).src = A[`p${k}_idle`]);
  if(c){ let f=0; cardTimer = setInterval(()=>{ const im=document.getElementById('cardImg_'+c); if(im) im.src = A[`p${c}_${(f++%2)?'cheer0':'cheer1'}`]; }, 420); }
  if(sound && c) sfx.pick();
}
let chosenChar = null;
function pickChar(c){ chosenChar = c; setChar(c); checkCover(); }
function cleanName(){ return (document.getElementById('nameInput').value||'').replace(/\s+/g,' ').trim(); }
let lastLen = 0;
function checkCover(){
  const n = cleanName(), c = chosenChar || state.char;
  if(n.length !== lastLen){ if(document.activeElement && document.activeElement.id==='nameInput') sfx.key(); lastLen = n.length; }
  const pin = cloud.on() ? document.getElementById('pinInput').value : '0000';
  const ok = !!c && n.length >= 2 && pin.length === 4;
  document.getElementById('coverStartBtn').disabled = !ok;
  const h = document.getElementById('coverHelp'); h.classList.remove('err');
  h.textContent = !c ? 'Pilih detektif dahulu.' : n.length<2 ? 'Taip nama anda (sekurang-kurangnya 2 huruf).' : pin.length<4 ? 'Masukkan PIN 4 nombor.' : `Sedia, Detektif ${n}? Tekan MULA!`;
}
let starting = false;
async function coverStart(){
  let canon = null;
  const n = cleanName(), c = chosenChar || state.char;
  const pin = cloud.on() ? document.getElementById('pinInput').value : '';
  if(!c || n.length<2 || (cloud.on() && pin.length!==4) || starting){ if(!starting) sfx.warn(); return; }
  ac();
  if(cloud.on()){
    const btn = document.getElementById('coverStartBtn'), lab = btn.querySelector('span'), help = document.getElementById('coverHelp');
    starting = true; btn.disabled = true; lab.textContent = 'MENYEMAK...';
    try{
      const res = await cloud.post({action:'register', nama:n, pin, watak:c});
      if(!res.ok){
        starting = false; lab.textContent = 'MULA'; checkCover(); sfx.warn();
        help.classList.add('err');
        help.textContent = res.error==='pin' ? 'Nama ini sudah didaftarkan dengan PIN lain. Semak PIN anda, atau gunakan nama lain.' : 'Semak nama dan PIN anda.';
        return;
      }
      const same = state.name && state.name.toLowerCase()===n.toLowerCase();
      if(!same){ state.done = {}; state.first = {}; state.tries = {}; state.queue = []; }
      applyProgress(res);
      let run = 0; for(const sc of SCENARIOS){ if(state.done[sc.id]) run++; else break; }
      state.mapPos = run ? Math.min(4, run + 1) : 0;
      if(Object.keys(res.done||{}).length) toast(`👋 Selamat kembali, ${res.nama||n}! Markah anda dimuatkan.`);
      if(res.nama) canon = res.nama;
    }catch(e){
      toast('⚠️ Tiada sambungan ke papan markah. Markah akan dihantar bila talian pulih.', true);
      if(state.name && state.name.toLowerCase()!==n.toLowerCase()){ state.done = {}; state.first = {}; state.tries = {}; state.queue = []; state.mapPos = 0; }
    }
    starting = false; lab.textContent = 'MULA';
    state.pin = pin;
  } else if(state.name && state.name !== n){ state.done = {}; state.first = {}; state.tries = {}; state.queue = []; state.mapPos = 0; }   // murid lain pada peranti yang sama
  sfx.launch();
  const rk = document.getElementById('launch'); rk.classList.remove('go'); void rk.offsetWidth; rk.classList.add('go'); setTimeout(()=>rk.classList.remove('go'), 1200);
  state.name = canon || n; state.char = c; save();
  flushPending(true);
  clearInterval(cardTimer);
  const cv = document.getElementById('cover'); cv.classList.add('hide');
  document.body.classList.remove('on-cover');
  setTimeout(()=>{ cv.style.display='none'; }, 450);
  drawMap(false);
  const next = progressIndex();
  if(!Object.keys(state.done).length) setTimeout(()=>showBriefing(true), 550);
  else if(next >= 4) setTimeout(()=>showSummary(), 600);
  else if(next < 4 && state.mapPos < next) setTimeout(()=>drawMap(true), 400);
}
function resetGame(){ state = {name:null, char:null, pin:'', done:{}, first:{}, tries:{}, queue:[], mapPos:0}; chosenChar = null; save(); drawMap(false); showCover(); }

/* ---------- Muat satu skrin: kecilkan kandungan secara automatik (tiada tatal) ---------- */
function fitAll(){
  document.querySelectorAll('#panel .fit').forEach(box=>{
    const inner = box.firstElementChild; if(!inner) return;
    if(!isWide()){ inner.style.cssText = ''; return; }
    const W = box.clientWidth, H = box.clientHeight; if(!W || !H) return;
    const fixed = +inner.dataset.w || 0;
    let s = 1;
    let top = 0;
    if(fixed){
      inner.style.width = fixed + 'px'; inner.style.transform = 'none';
      const h = inner.offsetHeight;
      s = Math.min(W/fixed, H/h);
      top = Math.max(0, (H - h*s)/2);
    } else {
      const fits = k => { inner.style.width = (W/k) + 'px'; inner.style.transform = 'none'; return inner.offsetHeight * k <= H; };
      const maxS = +(box.dataset.max || 1.25);
      let lo, hi;
      if(fits(1)){ lo = 1; hi = maxS; } else { lo = .45; hi = 1; }
      for(let i=0;i<7;i++){ const m=(lo+hi)/2; if(fits(m)) lo=m; else hi=m; }
      s = lo; fits(s);
    }
    inner.style.top = top + 'px';
    inner.style.transform = `translateX(-50%) scale(${s})`;
  });
}
addEventListener('resize', ()=>requestAnimationFrame(fitAll));
const refit = () => { requestAnimationFrame(()=>{ fitAll(); setTimeout(fitAll, 120); }); };

function renderStep(){

  const steps = `<div class="steps"><span class="st ${scStep===1?'on':'done'}"><b>${scStep===1?'1':'✓'}</b>Siasat</span><span class="line"></span><span class="st ${scStep===2?'on':''}"><b>2</b>Putuskan</span></div>`;

    const chips = [...pickB].sort((x,y)=>x-y).map(i=>{ const t = sc.b[i].t; return `<span>🔎 ${t.length>48 ? t.slice(0,46)+'…' : t}</span>`; }).join('');

      <div class="fit"><div class="fit-inner decide">
        <div class="q-title">Langkah 2: Putuskan.</div>
        <div class="q-sub">Petunjuk meragukan yang anda jumpa (${pickB.size}):</div>

        <div class="q-title">Selepas siasatan, adakah sumber ini boleh dipercayai?</div>
        <div class="q-sub">Pilih satu jawapan.</div>
        <div class="a-opts">${sc.a.map((o,i)=>`<button class="kbtn ${aCols[i]} ${pickA===i?'sel':(pickA!==null?'dim':'')}" data-i="${i}" onclick="selA(${i})"><span>${o.t}</span></button>`).join('')}</div>
        <div class="hint-warn" id="warn"></div>
      </div></div>
      <div class="btn-row"><button class="kbtn grey" onclick="sfx.click();scStep=1;renderStep()"><span>⬅ Kembali siasat</span></button><button class="kbtn" onclick="submitScenario('${sc.id}')"><span>Hantar ✔</span></button></div>`;

function toStep2(){
  if(pickB.size===0){ document.getElementById('warn').textContent = 'Pilih sekurang-kurangnya satu petunjuk dahulu.'; sfx.warn(); return; }
  sfx.unlock(); scStep = 2; renderStep();
}
function selA(i){ pickA = i; sfx.on(); document.querySelectorAll('.a-opts .kbtn').forEach(b=>{ const on=+b.dataset.i===i; b.classList.toggle('sel',on); b.classList.toggle('dim',!on); }); }
function selB(i){ if(pickB.has(i)){ pickB.delete(i); sfx.off(); } else { pickB.add(i); sfx.on(); }
  document.querySelectorAll('.b-opt').forEach(b=>b.classList.toggle('sel', pickB.has(+b.dataset.i))); }
function submitScenario(id){
  const warn = document.getElementById('warn');
  if(pickA===null){ warn.textContent = 'Pilih satu keputusan dahulu.'; sfx.warn(); return; }
  sfx.submit();
  const sc = SCENARIOS.find(s=>s.id===id);
  const totalClues = sc.b.filter(o=>o.clue).length;
  const correct = [...pickB].filter(i=>sc.b[i].clue).length;
  const traps = [...pickB].filter(i=>!sc.b[i].clue).length;
  const aStatus = sc.a[pickA].s, lulus = correct >= 2;
  const markah = correct + (aStatus==='ok' ? 1 : 0), max = totalClues + 1;
  const rec = { a:'ABC'[pickA], aStatus, picks:[...pickB].sort((x,y)=>x-y), correct, traps, totalClues, lulus, markah, max, at:new Date().toISOString() };
  const prevBest = state.done[id];
  state.tries[id] = (state.tries[id]||0) + 1;
  if(!state.first[id]) state.first[id] = rec;
  const improved = !prevBest || better(rec, prevBest);
  if(improved) state.done[id] = rec;
  save(); postResult(); cloudSave(id, rec);
  showResult(sc, rec, {attempt: state.tries[id], improved: improved && !!prevBest});
  for(let k=0;k<Math.min(markah,6);k++) sfx.star(k);
  if(lulus){ confetti(); setTimeout(sfx.pass, 120); } else setTimeout(sfx.fail, 120);
}

/* ---------- Maklum balas: 3 halaman (Keputusan → Petunjuk → Komen Dina) ---------- */
let cheerTimer = null, res = null;
function showResult(sc, rec, info={}){
  res = { sc, rec, info, page: 0 };
  const idx = SCENARIOS.indexOf(sc);
  openModal(`<div class="panel-head"><h2>Senario ${sc.no}: Keputusan</h2><div class="head-right"><div class="res-tabs" id="resTabs">
      <button onclick="resGo(0,true)">1 · Markah</button><button onclick="resGo(1,true)">2 · Petunjuk</button><button onclick="resGo(2,true)">3 · Komen Dina</button></div>
      <button class="close-x" onclick="sfx.click();closeModal()" aria-label="Tutup">✕</button></div></div>
  <div class="panel-body">
    <div class="fit" id="resFit" data-max="1.35"><div class="fit-inner" id="resPage"></div></div>
    <div class="brief-nav res-nav">
      <div class="brief-right"><button class="kbtn grey" id="resBack" onclick="resGo(-1)"><span>⬅ Kembali</span></button>
        <button class="kbtn grey" onclick="retryScenario('${sc.id}')"><span>🔁 Cuba lagi</span></button></div>
      <div class="brief-dots" id="resDots"><i></i><i></i><i></i></div>
      <div class="brief-right"><button class="kbtn grey" id="resMap" onclick="sfx.click();closeModal()"><span>🗺️ Peta</span></button>
        <button class="kbtn" id="resNext" onclick="resGo(1)"><span>Seterusnya ➜</span></button>
        <button class="kbtn green" id="resScen" onclick="goNext(${idx})"><span>${idx<2?'Senario seterusnya ➜':'Lihat rumusan 🏅'}</span></button></div>
    </div>
  </div>`, NODES[idx+1].panel, true, true);
  renderRes();
}
function resGo(d, abs=false){
  if(!res) return;
  const n = abs ? d : res.page + d;
  if(n < 0 || n > 2) return;
  sfx.click(); res.page = n; renderRes();
}
function renderRes(){
  const {sc, rec, info, page} = res, box = document.getElementById('resPage'); if(!box) return;
  const aObj = sc.a['ABC'.indexOf(rec.a)], cls = {ok:'ok', mid:'mid', no:'no'}[aObj.s];
  const best = state.done[sc.id] || rec, tries = state.tries[sc.id] || 1;
  const mk = markOf(rec), mx = rec.max || maxOf(sc.id), dec = rec.aStatus==='ok' ? 1 : 0;
  clearInterval(cheerTimer);
  if(page===0){
    const head = rec.lulus ? `Bagus, Detektif ${esc(state.name)}! Anda jumpa ${rec.correct} daripada ${rec.totalClues} petunjuk.` : `Hampir! Anda jumpa ${rec.correct} daripada ${rec.totalClues} petunjuk.`;
    const bestLine = tries>1 ? `<div class="best-line">${info.improved?'🎉 Markah terbaik baharu! ':''}Cubaan ke-${info.attempt||tries} · Markah terbaik anda: ${markOf(best)}/${mx}</div>` : '';
    box.innerHTML = `<div class="res-p1">
      <div class="result-banner"><img id="resultHero" src="${rec.lulus?P('cheer0'):P('think')}" alt="Detektif">
        <div class="score-big"><span id="scoreNum">0</span><small>/ ${mx} markah</small></div>
        <div class="score-break"><span>🔎 Petunjuk: ${rec.correct}/${rec.totalClues}</span><span class="${dec?'':'zero'}">⚖️ Keputusan: ${dec}/1</span></div>
        <h3>${head}</h3>${bestLine}</div>
      <div class="fb-a ${cls}">Keputusan anda: "${aObj.t}" <b>${dec?'(+1 markah)':'(0 markah)'}</b><br>${aObj.fb}</div></div>`;
    let n = 0; const el = document.getElementById('scoreNum');
    const t = setInterval(()=>{ if(!el.isConnected || n>=mk){ clearInterval(t); return; } el.textContent = ++n; tone(700+n*90,.08,'triangle',.08); }, 260);
    if(rec.lulus){ let f=0; cheerTimer = setInterval(()=>{ const im=document.getElementById('resultHero'); if(!im) return clearInterval(cheerTimer); im.src = (f++%2)?P('cheer0'):P('cheer1'); }, 380); }
  } else if(page===1){
    const items = sc.b.map((o,i)=>{
      const picked = rec.picks.includes(i);
      if(o.clue && picked) return `<div class="fb-item found"><span class="tag">✓ +1 · ${o.k}</span><div><b>${o.t}</b>Betul! Ini petunjuk yang meragukan.</div></div>`;
      if(o.clue) return `<div class="fb-item miss"><span class="tag">✗ TERLEPAS · ${o.k}</span><div><b>${o.t}</b>${o.miss}</div></div>`;
      if(picked) return `<div class="fb-item trap"><span class="tag">⚠ PERANGKAP</span><div><b>${o.t}</b>${o.pick}</div></div>`;
      return `<div class="fb-item safe"><span class="tag">✓ TIDAK TERTIPU</span><div><b>${o.t}</b>Ini bukan petunjuk. Anda betul tidak memilihnya.</div></div>`;
    }).join('');
    const nFound = rec.correct, nMiss = rec.totalClues - rec.correct, nTrap = rec.traps;
    box.innerHTML = `<div class="res-p2"><div class="q-title" style="margin-top:0">Petunjuk yang anda pilih</div>
      <div class="score-break" style="justify-content:flex-start;margin-bottom:12px"><span>✓ Ditemui: ${nFound}</span><span class="${nMiss?'zero':''}">✗ Terlepas: ${nMiss}</span><span class="${nTrap?'zero':''}">⚠ Perangkap dipilih: ${nTrap}</span></div>
      <div class="fb-list">${items}</div></div>`;
  } else {
    box.innerHTML = `<div class="brief res-p3"><img class="brief-dina" src="${A.dina_talk}" alt="Detektif Dina">
      <div class="brief-bubble" style="cursor:default"><div class="brief-who">Komen Detektif Dina</div>
        <div class="brief-text">${sc.general}</div>
        <div class="brief-vis"><div class="bv-row"><span class="bv-tile on">🔎 Sebelum percaya, tanya SEMAK dulu!</span></div></div></div></div>`;
    tone(620,.05,'triangle',.05); tone(780,.06,'triangle',.05,.06);
  }
  document.querySelectorAll('#resDots i').forEach((d,i)=>{ d.classList.toggle('on', i===page); d.classList.toggle('done', i<page); });
  document.querySelectorAll('#resTabs button').forEach((b,i)=>b.classList.toggle('on', i===page));
  document.getElementById('resBack').style.display = page ? '' : 'none';
  document.getElementById('resNext').style.display = page<2 ? '' : 'none';
  document.getElementById('resMap').style.display = page===2 ? '' : 'none';
  document.getElementById('resScen').style.display = page===2 ? '' : 'none';
  refit();
}
addEventListener('keydown', e=>{
  if(!document.getElementById('resPage') || !modal.classList.contains('show')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); resGo(1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); resGo(-1); }
});
function retryScenario(id){ sfx.unlock(); showScenario(SCENARIOS.find(s=>s.id===id)); }
function goNext(idx){ sfx.unlock(); closeModal(true, ()=>openNode(idx+2)); }

function togglePinShow(){ const el=document.getElementById('pinShow'); if(!el) return; sfx.click(); el.textContent = el.textContent==='••••' ? state.pin : '••••'; }
function togglePinInput(btn){ const i=document.getElementById('pinInput'); sfx.click(); const show = i.type==='password'; i.type = show ? 'text' : 'password'; btn.textContent = show ? '🙈' : '👁'; btn.title = show ? 'Sembunyikan PIN' : 'Lihat PIN'; }

/* ---------- Skrin 3.4 Rumusan ---------- */
function showSummary(){
  const pass = SCENARIOS.filter(s=>state.done[s.id]?.lulus).length, hp3 = pass>=2;
  const rows = SCENARIOS.map(s=>{ const r=state.done[s.id], t=state.tries[s.id]||1;
    if(!r) return `<tr><td>Senario ${s.no} · ${s.short}<br><small style="font-weight:700;color:#5b6283">Belum dijawab</small></td><td><b class="sum-mk">–</b> <button class="mini-btn" onclick="retryScenario('${s.id}')" title="Mula">▶</button></td></tr>`;
    return `<tr><td>Senario ${s.no} · ${s.short}<br><small style="font-weight:700;color:#5b6283">Terbaik: ${r.correct}/${r.totalClues} petunjuk, keputusan ${r.aStatus==='ok'?'betul':'kurang tepat'} · ${r.traps} perangkap · ${t} cubaan</small></td>
      <td><b class="sum-mk">${markOf(r)}/${r.max||maxOf(s.id)}</b> <span class="pill ${r.lulus?'ok':'no'}">${r.lulus?'Lulus':'Belum'}</span>
      <button class="mini-btn" onclick="retryScenario('${s.id}')" title="Cuba lagi">🔁</button></td></tr>`; }).join('');
  openModal(`<div class="panel-head"><h2>Siasatan Selesai!</h2><button class="close-x" onclick="sfx.click();closeModal()" aria-label="Tutup">✕</button></div>
  <div class="panel-body">
    <div class="cols cols-even">
      <div class="col">
        <div class="badge-wrap"><img class="ring" src="${A.cross_yellow}" alt=""><div class="badge"><img src="${P('cheer1')}" alt=""></div></div>
        <div class="badge-title">${tierOf(marks()).ic} ${tierOf(marks()).t}</div>
        <div class="tier-key">🏅 10–14 Bertauliah · 🔍 5–9 Penyiasat Muda · 🌱 1–4 Pelatih</div>
        ${cloud.on() && state.pin ? `<div class="pin-note">🔒 PIN anda: <b id="pinShow">••••</b> <button class="mini-btn" onclick="togglePinShow()" title="Lihat PIN">👁</button><br><small>Ingat PIN ini untuk sambung di laptop lain.</small></div>` : ''}
        ${dinaSay(A.dina_talk, `"Siasatan selesai, Detektif ${esc(state.name)}! Anda lulus ${pass} daripada 3 senario. Ingat: video popular, laman penuh iklan, malah AI pun boleh salah. Sebelum percaya, tanya SEMAK dulu."`)}
      </div>
      <div class="col">
        <table class="sum-table">${rows}</table>
        ${barHtml(marks(),TOTAL_MAX(),`🏅 ${marks()} / ${TOTAL_MAX()} markah`)}
        <div class="q-sub" style="margin-top:10px">Mahu markah lebih tinggi? Tekan 🔁 untuk cuba lagi mana-mana senario.</div>
        <div class="btn-row">
          <button class="kbtn blue" onclick="sfx.click();showBoard()"><span>🏆 Papan Markah</span></button>
        </div>
      </div>
    </div>
  </div>`, 'yellow', true);
  confetti(); sfx.win();
}
function resultLine(){
  const pass = SCENARIOS.filter(s=>state.done[s.id]?.lulus).length;
  const cell = s=>{ const r=state.done[s.id]; return r?`${r.a} | ${markOf(r)}/${r.max||maxOf(s.id)} markah | ${state.tries[s.id]||1}x`:'- | - | -'; };
  return `${state.name} | ${SCENARIOS.map(cell).join(' | ')} | Jumlah ${marks()}/${TOTAL_MAX()} | HP3 ${pass>=2?'Tercapai':'Belum'}`;
}
function copyResult(btn){
  sfx.click();
  const t = resultLine(), lab = btn.querySelector('span');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ lab.textContent='✅ Disalin!'; })
    .catch(()=>{ if(document.querySelector('.copy-box')) return; const box=document.createElement('textarea'); box.className='copy-box'; box.value=t; box.readOnly=true;
      btn.closest('.col').appendChild(box); box.select(); lab.textContent='Salin teks di bawah'; });
}
function postResult(){
  const pass = SCENARIOS.filter(s=>state.done[s.id]?.lulus).length;
  try{ window.parent.postMessage({ type:'detektif-sumber-bahagian3', murid:state.name, watak:state.char==='m'?'lelaki':'perempuan', terbaik:state.done, cubaanPertama:state.first, bilCubaan:state.tries, senarioLulus:pass, ringkasan:resultLine() }, '*'); }catch(e){}
}

/* ===================== PAPAN MARKAH KELAS ===================== */
let boardTimer = null;
function showBoard(){
  const cv = document.getElementById('cover'); const fromCover = cv.style.display !== 'none' && !cv.classList.contains('hide');
  if(fromCover){ cv.classList.add('hide'); setTimeout(()=>{ cv.style.display='none'; }, 300); }
  openModal(`<div class="panel-head"><h2>🏆 Papan Markah</h2><button class="close-x" onclick="closeBoard(${fromCover})" aria-label="Tutup">✕</button></div>
  <div class="panel-body"><div id="boardBody"><div class="spinner"></div></div>
    <div class="btn-row"><button class="kbtn grey" onclick="sfx.click();loadBoard()"><span>🔄 Muat semula</span></button>
    <button class="kbtn" onclick="closeBoard(${fromCover})"><span>${fromCover?'⬅ Muka depan':'🗺️ Peta'}</span></button></div></div>`, 'blue', true);
  loadBoard();
  clearInterval(boardTimer); boardTimer = setInterval(()=>{ if(document.getElementById('boardBody')) loadBoard(true); else clearInterval(boardTimer); }, 15000);
}
function closeBoard(fromCover){ sfx.click(); clearInterval(boardTimer); if(fromCover){ modal.classList.remove('show'); showCover(); } else closeModal(); }
async function loadBoard(quiet=false){
  const box = document.getElementById('boardBody'); if(!box) return;
  if(!cloud.on()){ box.innerHTML = `<div class="board-empty">Papan markah belum disambungkan.<br>Guru perlu mengisi <b>SHEET_URL</b> dalam fail game.</div>`; return; }
  if(!quiet) box.innerHTML = '<div class="spinner"></div>';
  try{
    const res = await cloud.get({action:'board'});
    if(!document.getElementById('boardBody')) return;
    const rows = res.rows || [];
    if(!rows.length){ box.innerHTML = '<div class="board-empty">Belum ada markah. Jadilah detektif pertama! 🚀</div>'; return; }
    const medal = (i,r) => (r.jumlah>0 && ['🥇','🥈','🥉'][i]) || (i+1);
    const me = (state.name||'').toLowerCase();
    const cell = r => k => r.s[k] ? `<b>${r.s[k].markah}/${r.s[k].max||maxOf(k)}</b>${r.s[k].cubaan>1?`<br><small style="color:#7a7f9e">${r.s[k].cubaan} cubaan</small>`:''}` : '<span style="color:#a9acc2">–</span>';
    box.innerHTML = `<div class="board-meta"><span>${rows.length} detektif · dikemas kini ${new Date().toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'})}</span><span>Dikemas kini automatik setiap 15 saat</span></div>
      <table class="board"><tr><th></th><th>Detektif</th><th class="sc">3.1</th><th class="sc">3.2</th><th class="sc">3.3</th><th style="text-align:right">Jumlah</th></tr>
      ${rows.map((r,i)=>`<tr class="${r.nama.toLowerCase()===me?'me':''}"><td>${medal(i,r)}</td>
        <td><div class="who"><img src="${A['p'+(r.watak==='m'?'m':'f')+'_idle']}" alt=""><div>${esc(r.nama)}${r.nama.toLowerCase()===me?' (anda)':''}<br>
          <span class="pill ${tierOf(r.jumlah).c}">${tierOf(r.jumlah).ic} ${tierOf(r.jumlah).s}</span>${r.selesai<3?` <small style="color:#7a7f9e">${r.selesai}/3 senario</small>`:''}</div></div></td>
        <td class="sc">${cell(r)('s1')}</td><td class="sc">${cell(r)('s2')}</td><td class="sc">${cell(r)('s3')}</td>
        <td class="tot">🏅 ${r.jumlah} / ${TOTAL_MAX()}</td></tr>`).join('')}</table>`;
  }catch(e){ if(!quiet) box.innerHTML = '<div class="board-empty">⚠️ Tidak dapat memuatkan papan markah. Semak sambungan internet dan cuba lagi.</div>'; }
}

/* ===================== KONFETI ===================== */
function confetti(){
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#FF4FA3','#FFD23F','#19C6F0','#2FD07A','#7B3FF2','#E0912F'];
  const ps = Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
  let f = 0;
  (function tick(){ ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.a+=.1; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if(++f<170) requestAnimationFrame(tick); else ctx.clearRect(0,0,c.width,c.height); })();
}

/* ===================== MULA: muka depan dahulu ===================== */
document.querySelectorAll('[data-s]').forEach(i=>i.src = S[i.dataset.s]);
document.querySelectorAll('.muteBtn').forEach(b=>b.textContent = muted?'🔇':'🔊');
state.mapPos = Math.min(state.mapPos||0, progressIndex());
chosenChar = state.char || null;
drawMap(false);
showCover();
